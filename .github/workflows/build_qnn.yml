name: Build ONNX Runtime (Shared NDK22, Static NDK28)

on:
  workflow_dispatch:

jobs:
  build-android-qnn:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 使用 sdkmanager 需要 Java 环境
      - name: 配置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 安装编译环境与 Python 依赖
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build python3-pip
          pip install gdown

      # ============== 用官方 SDK 管理器安装 NDK 22 和 28 ==============
      - name: 设置 Android SDK 并安装指定 NDK
        run: |
          mkdir -p $GITHUB_WORKSPACE/android-sdk
          export ANDROID_SDK_ROOT=$GITHUB_WORKSPACE/android-sdk
          
          # 1. 下载最新的 commandlinetools (包含 sdkmanager)
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          
          # 2. 使用 sdkmanager 安装对应的 NDK 版本 (r22b 对应 22.1.7171670，r28 对应 28.0.11718014)
          echo "正在下载 NDK 22 和 NDK 28，请耐心等待..."
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;22.1.7171670" "ndk;28.0.11718014"
          
          # 3. 把 NDK 路径写入环境变量供后续使用
          echo "ANDROID_NDK_22=$ANDROID_SDK_ROOT/ndk/22.1.7171670" >> $GITHUB_ENV
          echo "ANDROID_NDK_28=$ANDROID_SDK_ROOT/ndk/28.0.11718014" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: 下载 QNN SDK (Google Drive)
        run: |
          gdown 1mWBqYnpVw5coBF7x5ZTFxf93z0ERwE8H -O qnn-sdk.zip
          unzip qnn-sdk.zip -d $GITHUB_WORKSPACE/qnn-sdk

      # ============== 第 1 步：用 NDK 22 编译动态库 (.so) ==============
      - name: 编译 Shared Lib (NDK 22)
        run: |
          export ANDROID_NDK=$ANDROID_NDK_22  # 使用刚才设置的环境变量
          export ANDROID_API=36
          cd onnxruntime
          ./build.sh --config Release \
            --android \
            --android_abi arm64-v8a \
            --android_api $ANDROID_API \
            --use_qnn shared_lib \
            --qnn_home $GITHUB_WORKSPACE/qnn-sdk \
            --build_shared_lib \
            --build \
            --parallel
          # 保存产物
          mv build/Android/Release $GITHUB_WORKSPACE/Release_Shared

      # ============== 第 2 步：用 NDK 28 编译静态库 (.a) ==============
      - name: 编译 Static Lib (NDK 28)
        run: |
          export ANDROID_NDK=$ANDROID_NDK_28  # 使用刚才设置的环境变量
          export ANDROID_API=36
          cd onnxruntime
          ./build.sh --config Release \
            --android \
            --android_abi arm64-v8a \
            --android_api $ANDROID_API \
            --use_qnn static_lib \
            --qnn_home $GITHUB_WORKSPACE/qnn-sdk \
            --build_shared_lib \
            --build \
            --parallel
          # 保存产物
          mv build/Android/Release $GITHUB_WORKSPACE/Release_Static

      # ============== 上传两个版本的产物 ==============
      - name: 上传 NDK 22 动态库产物 (.so)
        uses: actions/upload-artifact@v4
        with:
          name: onnxruntime-shared-ndk22-qnn
          path: Release_Shared/libonnxruntime*.so

      - name: 上传 NDK 28 静态库产物 (.a)
        uses: actions/upload-artifact@v4
        with:
          name: onnxruntime-static-ndk28-qnn
          path: Release_Static/lib*.a
