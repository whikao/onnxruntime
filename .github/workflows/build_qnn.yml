name: Build ONNX Runtime QNN Shared Libs (Exclude System Dependencies)

on:
  workflow_dispatch:

jobs:
  build-android-qnn:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装编译工具及 Python 依赖
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build python3-pip
          pip install gdown

      - name: 下载 NDK r23b
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r23b-linux.zip
          unzip android-ndk-r23b-linux.zip
          echo "ANDROID_NDK=$GITHUB_WORKSPACE/android-ndk-r23b" >> $GITHUB_ENV

      - name: 下载 QNN SDK
        run: |
          gdown 1mWBqYnpVw5coBF7x5ZTFxf93z0ERwE8H -O qnn-sdk.zip
          unzip qnn-sdk.zip -d $GITHUB_WORKSPACE/qnn-sdk
          echo "QNN_HOME=$GITHUB_WORKSPACE/qnn-sdk" >> $GITHUB_ENV

      - name: 编译 ONNX Runtime 及 QNN Provider 动态库
        run: |
          ./build.sh --config Release \
            --android \
            --android_abi arm64-v8a \
            --android_api 36 \
            --use_qnn shared_lib \
            --qnn_home $QNN_HOME \
            --build_shared_lib \
            --build \
            --parallel

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: onnxruntime-qnn-core-libs-arm64
          path: onnxruntime/build/Android/Release/libonnxruntime*.so
