name: Build ONNX Runtime (NDK25, API 34 - QNN Shared)

on:
  workflow_dispatch:

jobs:
  build-android-qnn:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: "打补丁: 布局偏好 NHWC 改 NCHW (修 QDQ 编译被布局变换改废的 bug)"
        run: |
          # 定位 GetPreferredLayout 的实现 (可能在 .cc 或 .h)
          grep -rn "GetPreferredLayout" onnxruntime/core/providers/qnn/ || true
          # 只把该函数里的 NHWC 返回值改成 NCHW, 文件里其他 NHWC 不碰
          perl -0pi -e 's/(GetPreferredLayout\(\)[^}]*?)::NHWC/${1}::NCHW/s' \
            onnxruntime/core/providers/qnn/qnn_execution_provider.cc \
            onnxruntime/core/providers/qnn/qnn_execution_provider.h 2>/dev/null || true
          # 验证补丁生效, 没打上就报错终止, 不白编两小时
          grep -rn -A3 "GetPreferredLayout" onnxruntime/core/providers/qnn/*.h onnxruntime/core/providers/qnn/*.cc | grep -B1 -A3 "NCHW" || \
            { echo "::error::补丁没打上, 把上面的 grep 输出贴出来"; exit 1; }

      - name: 配置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 安装编译环境与 Python 依赖
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build python3-pip
          pip install gdown flatbuffers

      - name: 设置 Android SDK 并安装 NDK 25
        run: |
          mkdir -p $GITHUB_WORKSPACE/android-sdk
          export ANDROID_SDK_ROOT=$GITHUB_WORKSPACE/android-sdk

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest

          echo "正在下载 NDK 25..."
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" --channel=0

          echo "ANDROID_NDK_25=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: 下载 QNN SDK
        run: |
          gdown 1mWBqYnpVw5coBF7x5ZTFxf93z0ERwE8H -O qnn-sdk.zip
          unzip qnn-sdk.zip -d $GITHUB_WORKSPACE/qnn-sdk

      - name: 检查 QNN SDK 路径
        run: |
          echo "QNN SDK 路径："
          ls -d $GITHUB_WORKSPACE/qnn-sdk/qairt/2.48.0.260626

      - name: 编译 Shared Lib (NDK 25, API 34)
        run: |
          export ANDROID_NDK=$ANDROID_NDK_25

          ./build.sh --config Release \
            --android \
            --android_abi arm64-v8a \
            --android_api 34 \
            --use_qnn \
            --qnn_home $GITHUB_WORKSPACE/qnn-sdk/qairt/2.48.0.260626 \
            --build_shared_lib \
            --parallel \
            --skip_tests \
            --cmake_extra_defines="CMAKE_VERBOSE_MAKEFILE=ON" \
            --cmake_extra_defines="onnxruntime_ENABLE_CPUINFO=OFF" \
            --cmake_extra_defines="onnxruntime_ENABLE_LTO=OFF"

          mv build/Android/Release $GITHUB_WORKSPACE/Release_Shared

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: onnxruntime-shared-ndk25-api34-qnn-fixed
          path: |
            Release_Shared/libonnxruntime*.so
            Release_Shared/onnxruntime_perf_test
            Release_Shared/*.so
