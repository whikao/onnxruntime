name: Build ONNX Runtime (NDK25, API 34)

on:
  workflow_dispatch:

jobs:
  build-android-qnn:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 安装编译环境与 Python 依赖
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build python3-pip
          pip install gdown flatbuffers

      - name: 设置 Android SDK 并安装 NDK 25
        run: |
          mkdir -p $GITHUB_WORKSPACE/android-sdk
          export ANDROID_SDK_ROOT=$GITHUB_WORKSPACE/android-sdk
          
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          
          echo "正在下载 NDK 25，请耐心等待..."
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" --channel=0
          
          echo "ANDROID_NDK_25=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: 下载 QNN SDK (Google Drive)
        run: |
          gdown 1mWBqYnpVw5coBF7x5ZTFxf93z0ERwE8H -O qnn-sdk.zip
          unzip qnn-sdk.zip -d $GITHUB_WORKSPACE/qnn-sdk

      # ============== 新增：打印解压后的路径 ==============
      - name: 检查 QNN SDK 解压后的路径
        run: |
          echo "---------------------------------------"
          echo "下面是解压后的 QNN SDK 结构，请找到包含 'include/QNN' 和 'lib' 的父级目录！"
          echo "---------------------------------------"
          find $GITHUB_WORKSPACE/qnn-sdk -maxdepth 3
          echo "---------------------------------------"

      # ============== 编译 ==============
      - name: 编译 Shared Lib (NDK 25, API 34)
        run: |
          # 注意：如果你的 qnn-sdk 里面还套了一层文件夹，比如 qnn-sdk/v2.25.0
          # 请务必把 --qnn_home 的路径改为 qnn-sdk/v2.25.0
          ./build.sh --config Release \
            --android \
            --android_abi arm64-v8a \
            --android_api 34 \
            --use_qnn static_lib \
            --qnn_home $GITHUB_WORKSPACE/qnn-sdk \
            --build_shared_lib \
            --parallel \
            --cmake_extra_defines="CMAKE_VERBOSE_MAKEFILE=ON" \
            --android_ndk_path $ANDROID_NDK_25
          
          mv build/Android/Release $GITHUB_WORKSPACE/Release_Shared

      # ============== 上传产物 ==============
      - name: 上传 NDK 25 动态库产物 (.so 与 onnxruntime_perf_test)
        uses: actions/upload-artifact@v4
        with:
          name: onnxruntime-shared-ndk25-api34-qnn
          path: |
            Release_Shared/libonnxruntime*.so
            Release_Shared/onnxruntime_perf_test
