name: Package QNN Genie Runtime (QAIRT 2.48, aarch64-android)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-genie:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装工具
        run: |
          sudo apt update
          sudo apt install -y python3-pip zip
          pip install gdown

      - name: 下载 QNN SDK
        run: |
          gdown 1mWBqYnpVw5coBF7x5ZTFxf93z0ERwE8H -O qnn-sdk.zip
          unzip -q qnn-sdk.zip -d $GITHUB_WORKSPACE/qnn-sdk

      - name: 定位并检查 SDK
        run: |
          SDK=$(ls -d $GITHUB_WORKSPACE/qnn-sdk/qairt/*/)
          echo "SDK=$SDK" >> $GITHUB_ENV
          test -f "$SDK/bin/aarch64-android/genie-t2t-run" || { echo "::error::未找到 genie-t2t-run"; exit 1; }
          test -f "$SDK/lib/aarch64-android/libGenie.so" || { echo "::error::未找到 libGenie.so"; exit 1; }

      - name: 抽取 Genie 运行所需文件
        run: |
          OUT=$GITHUB_WORKSPACE/genie-android-arm64
          mkdir -p $OUT
          cp "$SDK/bin/aarch64-android/genie-t2t-run" $OUT/
          cp "$SDK/lib/aarch64-android/"*.so $OUT/
          # 只拷 *Skel*.so, hexagon 目录的 libQnnSystem.so 是32位DSP格式,全拷会覆盖ARM64版
          for v in v73 v75 v79 v81; do
            [ -d "$SDK/lib/hexagon-$v/unsigned" ] && cp "$SDK/lib/hexagon-$v/unsigned/"*Skel*.so $OUT/ 2>/dev/null || true
          done
          file $OUT/libQnnSystem.so | grep -q "aarch64" || { echo "::error::libQnnSystem.so 不是 aarch64!"; exit 1; }
          echo "✅ libQnnSystem.so 架构正确"

      - name: 附 Termux 运行脚本
        run: |
          OUT=$GITHUB_WORKSPACE/genie-android-arm64
          cat > $OUT/run.sh << 'EOF'
          #!/bin/bash
          cd "$(dirname "$0")"
          export LD_LIBRARY_PATH=.:/vendor/lib64:/system/lib64
          export ADSP_LIBRARY_PATH=.
          MODEL_DIR="${GENIE_MODEL:-/sdcard/llmbin}"
          CFG=$(find "$MODEL_DIR" -maxdepth 2 -name "genie_config.json" | head -n 1)
          if [ -z "$CFG" ]; then echo "ERROR: $MODEL_DIR 下没找到 genie_config.json"; exit 1; fi
          echo "使用配置: $CFG"
          PROMPT="${1:-介绍一下广州}"
          ./genie-t2t-run -c "$CFG" -p "$PROMPT"
          EOF
          sed -i 's/^  *//' $OUT/run.sh
          chmod +x $OUT/run.sh

      - name: 打包 zip
        run: |
          cd $GITHUB_WORKSPACE
          zip -q -r genie-android-arm64.zip genie-android-arm64
          ls -lh genie-android-arm64.zip

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: genie-android-arm64
          path: genie-android-arm64.zip

      - name: 发布 Release
        run: |
          TAG="genie-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" genie-android-arm64.zip --title "QNN Genie Runtime $TAG" --notes "Termux: 解压后 cd 进目录, ./run.sh \"提示词\""
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
